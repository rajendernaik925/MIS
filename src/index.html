<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MIS Dynamic Reports</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/management.png">

  <!-- Icon fonts + Bootstrap CSS used across the app (sidebar/header fa-* icons,
       page-not-found bi-* icons, offcanvas/toast/grid utility classes).
       These were referenced throughout the templates but never linked, which
       is why icons rendered as blank squares. If your build already pulls
       these in via angular.json's "styles"/"scripts" arrays, these CDN tags
       are redundant but harmless — remove whichever you don't need. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <app-root></app-root>

  <!-- Bootstrap JS bundle: required for the login page's offcanvas
       (data-bs-dismiss, etc.) to function. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
