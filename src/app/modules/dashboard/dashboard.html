<div class="dash">

  <!-- ===================== Stat cards ===================== -->
  <div class="dash__stats">
    <div
      class="stat-card glass"
      [class.stat-card--loading]="loading()"
      *ngFor="let card of statCards()">
      <p class="stat-card__label">{{ card.label }}</p>
      <p class="stat-card__value" [style.color]="card.valueColor">{{ card.value }}</p>
      <p class="stat-card__sublabel">{{ card.sublabel }}</p>
    </div>
  </div>

  <div class="dash__status" *ngIf="loadError()">
    <span class="dash__status-dot"></span>
    Couldn't load the dashboard summary for this selection. Please try again.
  </div>

  <p class="dash__footnote">{{ statsFootnote }}</p>

  <!-- ===================== Donut charts by group ===================== -->
  <div class="dash__grid dash__grid--donuts">
    <section class="panel glass" *ngFor="let donut of donuts">
      <div class="panel__heading">
        <h3 class="panel__title">{{ donut.title }}</h3>
        <p class="panel__subtitle">{{ donut.subtitle }}</p>
      </div>

      <div class="donut-wrap">
        <div class="donut" [style.background]="donutGradient(donut)">
          <div class="donut__hole"></div>
        </div>
      </div>

      <div class="legend">
        <span class="legend__item" *ngFor="let seg of donut.segments">
          <span class="legend__swatch" [style.background]="seg.color"></span>
          {{ seg.label }}
        </span>
      </div>
    </section>
  </div>

  <!-- ===================== Top units by Net Payable ===================== -->
  <div class="dash__grid dash__grid--bars">
    <section class="panel glass" *ngFor="let chart of barCharts">
      <h3 class="panel__title panel__title--bars">{{ chart.title }}</h3>

      <div class="bar-chart">
        <div class="bar-row" *ngFor="let row of chart.rows">
          <span class="bar-row__label">{{ row.label }}</span>
          <div class="bar-row__track">
            <div
              class="bar-row__fill"
              [style.width.%]="barWidth(chart, row)"
              [style.background]="chart.color"
            ></div>
          </div>
        </div>

        <div class="bar-axis">
          <span class="bar-axis__spacer"></span>
          <div class="bar-axis__ticks">
            <span class="bar-axis__tick" *ngFor="let tick of axisTicks(chart)">{{ tick }}</span>
          </div>
        </div>
      </div>
    </section>
  </div>

</div>
