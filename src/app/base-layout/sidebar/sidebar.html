<!-- Backdrop only exists/shows for the mobile off-canvas drawer -->
<div class="sidebar-backdrop" *ngIf="mobileOpen" (click)="closeMobile()"></div>

<aside
  class="sidebar"
  [class.sidebar--collapsed]="collapsed"
  [class.sidebar--mobile-open]="mobileOpen"
>
  <div>
    <div class="sidebar__brand">
      <div class="sidebar__brand-info">
        <div class="sidebar__brand-icon">
          <i class="fa-solid fa-chart-pie"></i>
        </div>
        <span class="sidebar__brand-name sidebar-text">HHC MIS &amp; HR</span>
      </div>

      <!-- Desktop: collapse to icon rail -->
      <button
        class="sidebar__toggle"
        type="button"
        title="Collapse menu"
        (click)="toggleSidebar()"
      >
        <i class="fa-solid fa-bars"></i>
      </button>

      <!-- Mobile: close the off-canvas drawer -->
      <button
        class="sidebar__close-mobile"
        type="button"
        title="Close menu"
        (click)="closeMobile()"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <nav class="sidebar__nav">
      <a
        *ngFor="let item of navItems"
        class="sidebar__nav-link"
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-link--active"
        (click)="onNavClick()"
      >
        <i class="{{ item.icon }} sidebar__nav-icon"></i>
        <span class="sidebar-text sidebar__nav-label">{{ item.label }}</span>
        <span *ngIf="item.badge" class="sidebar__badge sidebar-text">{{ item.badge }}</span>
      </a>
    </nav>
  </div>

  <div class="sidebar__footer">
    <button
      class="sidebar__logout"
      type="button"
      title="Logout"
      (click)="onLogout()"
    >
      <i class="fa-solid fa-right-from-bracket sidebar__nav-icon"></i>
      <span class="sidebar-text sidebar__nav-label">Logout</span>
    </button>

    <div class="sidebar__profile">
      <div class="sidebar__profile-avatar">MIS</div>
      <div class="sidebar-text sidebar__profile-info">
        <p class="sidebar__profile-name">Corporate MIS</p>
        <p class="sidebar__profile-sub">HYD + MUM + Consultants</p>
      </div>
    </div>
  </div>
</aside>
