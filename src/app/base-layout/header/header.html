<header class="header">
  <div class="header__title-row">
    <button
      class="header__menu-btn"
      type="button"
      aria-label="Open menu"
      (click)="menuToggle.emit()"
    >
      <i class="fa-solid fa-bars"></i>
    </button>
    <h2 class="header__title">{{ pageTitle }}</h2>
  </div>

  <div class="header__actions">
    <div class="dropdown">
      <button
        class="dropdown__trigger"
        type="button"
        (click)="togglePayPeriod()"
        [attr.aria-expanded]="payPeriodOpen()"
        aria-haspopup="listbox"
      >
        <i class="fa-regular fa-calendar dropdown__icon"></i>
        <span class="dropdown__label">
          {{ filterState.loadingPayPeriods() ? 'Loading…' : (payPeriodSelectedLabel() || 'Select period') }}
        </span>
        <i class="fa-solid fa-chevron-down dropdown__chevron" [class.dropdown__chevron--open]="payPeriodOpen()"></i>
      </button>

      <div class="dropdown__panel" *ngIf="payPeriodOpen()" role="listbox">
        <div class="dropdown__section-label">View by period</div>
        <button
          *ngFor="let period of filterState.payPeriods(); trackBy: trackByValue"
          type="button"
          class="dropdown__item"
          [class.dropdown__item--selected]="period.value === filterState.selectedPayPeriod()"
          role="option"
          [attr.aria-selected]="period.value === filterState.selectedPayPeriod()"
          (click)="selectPayPeriod(period.value)"
        >
          <i class="fa-regular fa-calendar dropdown__item-icon"></i>
          <span class="dropdown__item-label">{{ period.label }}</span>
          <i class="fa-solid fa-check dropdown__check" *ngIf="period.value === filterState.selectedPayPeriod()"></i>
        </button>
      </div>
    </div>

    <div class="dropdown">
      <button
        class="dropdown__trigger dropdown__trigger--location"
        type="button"
        (click)="toggleLocation()"
        [attr.aria-expanded]="locationOpen()"
        aria-haspopup="listbox"
      >
        <span class="dropdown__label">
          {{ filterState.loadingLocations() ? 'Loading…' : (toTitleCase(locationSelectedLabel()) || 'Select location') }}
        </span>
        <i class="fa-solid fa-chevron-down dropdown__chevron" [class.dropdown__chevron--open]="locationOpen()"></i>
      </button>

      <div class="dropdown__panel" *ngIf="locationOpen()" role="listbox">
        <div class="dropdown__section-label">View by group</div>
        <button
          *ngFor="let loc of filterState.locations(); trackBy: trackByValue"
          type="button"
          class="dropdown__item"
          [class.dropdown__item--selected]="loc.value === filterState.selectedLocation()"
          role="option"
          [attr.aria-selected]="loc.value === filterState.selectedLocation()"
          (click)="selectLocation(loc.value)"
        >
          <i class="fa-solid fa-location-dot dropdown__item-icon"></i>
          <span class="dropdown__item-label">{{ toTitleCase(loc.label) }}</span>
          <i class="fa-solid fa-check dropdown__check" *ngIf="loc.value === filterState.selectedLocation()"></i>
        </button>
      </div>
    </div>

    <div class="employee-card" *ngIf="employeeData() as emp">
      <div class="employee-card__avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="employee-card__meta">
        <span class="employee-card__name">{{ toTitleCase(emp.employeeName) }}</span>
        <span class="employee-card__id">{{ emp.employeeId }}</span>
      </div>
    </div>
  </div>
</header>
