<div class="not-found-wrap d-flex flex-column align-items-center justify-content-center vh-100 bg-dark text-white position-relative overflow-hidden">

  <!-- Grid overlay -->
  <div class="grid-bg position-absolute inset-0"></div>

  <!-- Badge -->
  <span class="badge rounded-pill border border-secondary text-secondary mb-3 px-3 py-1 small text-uppercase tracking-wide">
    Error
  </span>

  <!-- 404 -->
  <h1 class="display-1 fw-bold text-white-50 mb-0" style="font-size: 7rem; letter-spacing: -4px;">404</h1>

  <!-- Title -->
  <h2 class="fw-bold mt-2 mb-2">Page Not Found</h2>

  <!-- Subtitle -->
  <p class="text-secondary text-center mb-4" style="max-width: 280px;">
    The page you're looking for doesn't exist or has been moved.
  </p>

  <hr class="border-secondary w-25 mb-4">

  <!-- Back button -->
  <button (click)="back()" class="btn btn-outline-secondary rounded-pill px-4 d-flex align-items-center gap-2">
    <i class="bi bi-arrow-left"></i>
    Back to Previous Page
  </button>

</div>
